name: Grow validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: grow_test
          POSTGRES_USER: grow_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grow_test -d grow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: synthetic-ci-only-not-a-secret
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: grow_test
      POSTGRES_USER: grow_test
      POSTGRES_PASSWORD: synthetic_ci_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py load_synthetic_fixtures
      - run: python manage.py load_synthetic_assessment_pack
      - run: python manage.py load_synthetic_career_pack
      - run: python -m pytest
