[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-foundation"
version = "0.1.0"
description = "Synthetic local domain foundation for Grow"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<3.4",
]

[project.optional-dependencies]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "mypy>=1.18,<1.20",
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.13,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "grow.config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
files = ["src", "tests"]
exclude = ["migrations"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.django-stubs]
django_settings_module = "grow.config.settings"
